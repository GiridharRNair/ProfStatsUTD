[project]
name = "profstats-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "uvicorn[standard]>=0.32,<1",
]

[tool.uv]
# The app is served from index.py, not installed as a package, and there is
# no build backend here for uv to build it with.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"index.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
files = ["app", "index.py"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
