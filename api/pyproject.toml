[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"index.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
files = ["app", "index.py"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
